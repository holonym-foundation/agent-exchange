name: guard

# Public-repo hygiene gate. Runs on every push + PR. Two layers:
#   1. gitleaks   — broad, industry secret scanning across the full history.
#   2. repo-guard — AEX-specific rules (blocked paths, box IPs, internal hostnames,
#                   managed-DB fingerprints, operational-wallet hash denylist).
# Make this a REQUIRED status check in branch protection (Settings → Branches).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks BINARY is free/MIT; only the gitleaks-action wrapper requires a
      # paid license for organizations. So we run the binary directly — full-history
      # secret scan, no license, --redact so any hit is never printed in the logs.
      - name: gitleaks (secret scan)
        run: |
          ver=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oE '"tag_name": *"v[^"]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      - name: repo-guard (AEX hygiene rules)
        run: |
          chmod +x scripts/repo-guard.sh
          scripts/repo-guard.sh
